<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Agent Policy Map terminal demonstration</title>
  <desc id="description">The CLI finds two active Codex instruction files and reports a possible npm versus pnpm conflict.</desc>
  <rect width="1200" height="620" rx="24" fill="#0b1220"/>
  <rect x="1" y="1" width="1198" height="618" rx="23" fill="none" stroke="#253247" stroke-width="2"/>

  <circle cx="42" cy="38" r="7" fill="#ef4444"/>
  <circle cx="66" cy="38" r="7" fill="#f59e0b"/>
  <circle cx="90" cy="38" r="7" fill="#22c55e"/>
  <text x="600" y="44" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">agent-policy-map</text>
  <line x1="0" y1="68" x2="1200" y2="68" stroke="#253247" stroke-width="2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">
    <text x="40" y="112" fill="#22c55e">$</text>
    <text x="64" y="112" fill="#e2e8f0">agent-policy-map inspect apps/api/src/auth.ts</text>
    <text x="64" y="142" fill="#e2e8f0">--agent codex --cwd apps/api --root .</text>

    <text x="40" y="194" fill="#94a3b8">Agent:</text>
    <text x="142" y="194" fill="#f8fafc">codex (Codex CLI)</text>
    <text x="40" y="226" fill="#94a3b8">Target:</text>
    <text x="142" y="226" fill="#f8fafc">./apps/api/src/auth.ts</text>

    <text x="40" y="282" fill="#4ade80" font-weight="700">ACTIVE</text>
    <text x="40" y="318" fill="#f8fafc">1. ./AGENTS.md</text>
    <text x="390" y="318" fill="#94a3b8">[codex-agents-md]</text>
    <text x="64" y="348" fill="#94a3b8">root instruction loaded first</text>
    <text x="40" y="386" fill="#f8fafc">2. ./apps/api/AGENTS.md</text>
    <text x="390" y="386" fill="#94a3b8">[codex-agents-md]</text>
    <text x="64" y="416" fill="#94a3b8">nested instruction loaded after the root</text>

    <text x="40" y="472" fill="#fbbf24" font-weight="700">DIAGNOSTICS</text>
    <text x="40" y="510" fill="#fbbf24">[warn] possible-conflict</text>
    <text x="64" y="542" fill="#e2e8f0">./AGENTS.md endorses npm</text>
    <text x="64" y="574" fill="#e2e8f0">./apps/api/AGENTS.md endorses pnpm</text>
  </g>
</svg>
